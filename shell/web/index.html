<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>InfantGod Studio — board</title>
<!--
  The whole page.  There is no tab strip and no side panel here until the board
  is asked for one: `mode classic` puts the same cards into a conventional
  arrangement (sidebar, tab strip, code area) as a *view* of the board
  document, computed by main.mjs from classic.mjs.  Nothing about it is stored,
  and `mode board` is the board again exactly as it was -- so the paradigm is
  still the board, and the conventional IDE is a way of looking at it.

  Everything the browser needs is in this directory.  No CDN, no framework, no
  build step, no network access beyond the kernel's own loopback endpoints.
-->
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- The board: one persistent 2-D surface. `#board` handles pan/zoom and all
       pointer gestures; `#stage` carries the single translate+scale. -->
  <main id="board" aria-label="board">
    <div id="stage">
      <!-- The link overlay lives *inside* #stage on purpose: #stage carries the
           one translate+scale transform, and main.mjs writes every path in world
           coordinates -- the same units as a card's x/y.  Nested here, the
           overlay pans and zooms with the cards for free; as a sibling of
           #stage it would stay put while the cards moved. -->
      <svg id="links" aria-hidden="true">
        <!-- connections are inserted here, in world coordinates -->
      </svg>
      <div id="cards">
        <!-- cards are inserted here by main.mjs -->
      </div>
    </div>

    <!-- The classic view's chrome, hidden until `mode classic`.  The tab strip
         is built by main.mjs -- one button per editor card -- and the hint
         stands in the sidebar column when the board has no project card to put
         there.  Both are laid out in pixels by classic.mjs, which is the same
         arithmetic that places the cards: one source of truth for the tile. -->
    <nav id="tabs" hidden aria-label="open files"></nav>
    <p id="side-hint" hidden></p>
  </main>

  <!-- Shown only while the board is empty, or when the kernel cannot be
       reached.  It is the visible "kernel not reachable" state: never a blank
       page and never a console-only error. -->
  <section id="empty-state" hidden>
    <h1 class="empty-title">the board is empty</h1>
    <p class="empty-text"></p>
    <button id="reload-board" class="empty-button" type="button">try to connect again</button>
  </section>

  <!-- A fixed heads-up strip: what is selected, at what zoom, saved or not. -->
  <header id="hud">
    <span class="hud-brand">InfantGod Studio</span>
    <span class="hud-sep">/</span>
    <span id="hud-selection" class="hud-item">no card</span>
    <span class="hud-spacer"></span>
    <span id="hud-revision" class="hud-item">unsaved</span>
    <span id="hud-dirty" class="hud-item">saved</span>
    <span id="hud-zoom" class="hud-item">100%</span>
    <!-- The second way to look at the same board.  A button rather than a
         keystroke: it is also the answer to "where did the classic view go?". -->
    <button id="mode-toggle" class="hud-item hud-button" type="button"
            aria-pressed="false" title="arrange the same cards as a code area, a tab strip and a sidebar (the board document is not changed)">classic view</button>
    <span id="kernel-status" class="hud-item is-connecting" data-state="connecting">connecting…</span>
  </header>

  <!-- The board's own log.  Every refusal, warning and unknown command lands
       here as a line, which is why InfantGod Studio needs no dialogs. -->
  <div id="log" role="log" aria-live="polite" aria-label="board log"></div>

  <!-- The single command line, at the bottom, acting on the focused card. -->
  <footer id="bar">
    <span class="bar-prompt" aria-hidden="true">&gt;</span>
    <input id="command" type="text" spellcheck="false" autocomplete="off"
           placeholder="open &lt;path&gt; · note &lt;text&gt; · run &lt;cmd&gt; · sheet [title] · files · project · mode classic · undo · link &lt;from&gt; &lt;to&gt; · help"
           aria-label="board command line">
    <span id="command-hint" class="bar-hint" aria-hidden="true"></span>
  </footer>

  <script type="module" src="./main.mjs"></script>
</body>
</html>
