# Rebuild a release where it was pushed.
#
# This file has never run on a GitHub runner.  It is written from the same
# commands a local cut runs, and tools/release.py is the one implementation of
# a release -- but until this workflow has a green run behind it, treat it as a
# plan rather than a fact.  (Every release note says the same thing.)
#
# It does NOT cut a release.  Cutting happens locally: tools/release.py commits
# the changelog date, builds the artifacts, writes the notes and tags the
# commit.  The tag is then pushed, and this workflow takes the tag as given:
#   * it rebuilds that commit's tree and re-runs the same suites,
#   * it writes the notes, the manifest and the same artifacts again
#     (`git archive` of a commit is deterministic, so the source zip should
#     hash the same as the one cut on the developer's machine),
#   * it keeps them as a workflow artifact, and publishes them as a release.
#
# docs/RELEASING.md holds the channel model this job is built on.

name: release

on:
  push:
    tags:
      - "v*"      # v0.2.0-alpha.2, v0.2.0-rc.1, v1.0.0
      - "*-v*"    # electron-example-v1.0.0 -- a fork's own tag
  workflow_dispatch:   # re-run the whole thing against any ref

# gh release create uploads assets, which needs write access to contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, the commit it points at, and the history around them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ci.yml installs the toolchain the same way; `make` and `gcc` are not on
      # the runner's PATH, and tools/build.py finds them in the MinGW bin
      # directory once this step has put them there.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
          path-type: inherit

      - name: Every copy of the version agrees
        shell: pwsh
        run: python tools/version.py check

      - name: The tag names the version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # A fork carries its own name in front: electron-example-v1.0.0.
          $shown = $tag -replace '^.+?-v(\d)', 'v$1'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($shown -ne "v$version") {
            throw "tag '$tag' does not name VERSION '$version' -- write the version first, or move the tag"
          }
          Write-Host "tag $tag names VERSION $version"

      - name: Build the release directory from the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # A fork tag names the fork, and release.py rebuilds exactly that
          # fork's bundle and delta.
          $fork = if ($tag -match '^(.+)-v\d') { $Matches[1] } else { "" }
          $forkArg = if ($fork) { "--fork=$fork" } else { "" }
          # --no-tag     : the tag exists; this run must not move it.
          # --no-freeze  : the changelog was dated when the tag was cut.
          # --allow-branch: a tag checkout is a detached HEAD, not `main`.
          python tools/release.py --no-tag --no-freeze --allow-branch $forkArg

      # If publishing below fails, the directory is still there to download.
      - name: Keep the release directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/**

      - name: Publish it as a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          $notes = Get-ChildItem dist -Recurse -Filter RELEASE-NOTES.md | Select-Object -First 1
          $assets = Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Extension -in ".zip", ".msi" } |
            ForEach-Object { $_.FullName }
          # A pre-release identifier in VERSION is what makes it a pre-release.
          $kind = if ($version -match "-") { "--prerelease" } else { "--latest" }
          gh release create $tag @assets --title "seIDE $version" $kind `
            --notes-file $notes.FullName --verify-tag
